[project]
name = "graph-cloud-benchmark"
version = "1.0.0"
description = "A reproducible, resource-parity benchmark of CognoDB Cloud against four other graph databases."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a live database connection (deselect with '-m \"not integration\"')",
]
